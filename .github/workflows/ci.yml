name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
    # Release pipeline depends on CI passing for the tag's commit SHA.
    # See .github/workflows/release.yml for the workflow_run gate.
    # GitHub Actions `tags` filter uses glob patterns (not regex), per
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushbranchestagsbranches.
    # In fnmatch glob semantics `*` matches zero-or-more chars and `+`
    # matches one-or-more of the preceding character, so
    # `v[0-9]+.[0-9]+.[0-9]+*` matches v1.0.0, v1.0.0-beta,
    # v1.2.3-rc.1, etc. (a literal `+` would require escaping as `\+`).
    # A leading or trailing `/` does NOT activate regex.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    env:
      VITE_USE_LOCAL_MOCKS: "true"
      VITE_DB_URL: "http://stub.local"
      VITE_DB_ANON_KEY: "stub-anon-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Production dependency graph (no devDeps). Must pass at moderate+.
        # See docs/operations/production-readiness-audit-2026-09-13.md W4.
        run: npm audit --audit-level=moderate --omit=dev

      - name: Audit dev dependencies
        # Full graph including devDeps. Must pass at high+. Moderate dev-tooling
        # advisories that don't reach the browser bundle are tolerated and
        # recorded in the audit completion record.
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
