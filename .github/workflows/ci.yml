name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    env:
      VITE_USE_LOCAL_MOCKS: "true"
      VITE_SUPABASE_URL: "http://stub.local"
      VITE_SUPABASE_ANON_KEY: "stub-anon-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
