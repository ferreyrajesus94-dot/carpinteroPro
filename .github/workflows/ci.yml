name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
    # GitHub Actions only triggers push workflows on tag pushes when an
    # explicit tags: filter is present (a branches-only filter does NOT
    # run the workflow on tag pushes). Use a broad 'v*' glob so the
    # minimatch `+` quantifier gotcha cannot block legitimate tags; the
    # helper (verify-release.mjs) enforces strict semver shape.
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushbranchestagsbranches
    # and https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#push
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    env:
      VITE_USE_LOCAL_MOCKS: "true"
      VITE_DB_URL: "http://stub.local"
      VITE_DB_ANON_KEY: "stub-anon-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Production dependency graph (no devDeps). Must pass at moderate+.
        # See docs/operations/production-readiness-audit-2026-09-13.md W4.
        run: npm audit --audit-level=moderate --omit=dev

      - name: Audit dev dependencies
        # Full graph including devDeps. Must pass at high+. Moderate dev-tooling
        # advisories that don't reach the browser bundle are tolerated and
        # recorded in the audit completion record.
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Single production route. Fires ONLY for tag pushes (after verify
  # succeeds) and forwards the tag + head_sha to release.yml. This is
  # a JOB-LEVEL reusable-workflow call: `uses:`, `with:`, and
  # `secrets: inherit` live on the job, not on a step (steps: and
  # runs-on: are NOT allowed alongside job-level uses; per
  # https://docs.github.com/en/actions/using-workflows/reusing-workflows#using-a-reusable-workflow-in-a-job).
  # Vercel's git integration is disabled for main in vercel.json so
  # plain main pushes cannot deploy. Branch pushes still auto-deploy as
  # Vercel previews (vercel.json leaves unspecified branches enabled).
  tag-deploy:
    name: Trigger release workflow for tag push
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
      head_sha: ${{ github.sha }}
    secrets: inherit
