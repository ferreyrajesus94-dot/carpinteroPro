name: Release

# Release pipeline: called as a reusable workflow from the CI tag-deploy
# job. The upstream CI job proves the GitHub event was a tag push via
# `startsWith(github.ref, 'refs/tags/')` (GitHub-provided event ref is
# authoritative; v-prefix / SHA-has-tag heuristics are unreliable). The
# helper still performs every other check (trusted repo, fork, push, head
# SHA shape, secrets, real-remote ls-remote tag peel).
#
# Trust flow (fail closed):
#   1. Helper is checked out from default_branch BEFORE any candidate.
#      persist-credentials:false so GITHUB_TOKEN never reaches .git/config.
#   2. Setup Node runs BEFORE the gate so the helper executes on Node 24.
#   3. Helper (verify-release.mjs) verifies trusted repo, no fork, head
#      SHA shape, all deploy secrets present, and a real Git tag peels to
#      the input head_sha via `git ls-remote --tags <url>` using the URL
#      derived from the trusted GITHUB_REPOSITORY context -- a PUBLIC
#      https://github.com/<o>/<r>.git call that carries no credentials.
#      Private-repo auth is out of scope; production deploys are
#      intentionally limited to public repos.
#   4. Only after verified=true do we check out the candidate and run
#      vercel pull/deploy. The gate reduces (does not eliminate) the trust
#      boundary.
#
# `secrets.*` is not used in job-level `if:` (Actions disallows that context).

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag name from the upstream CI tag-deploy job (event was a tag push)'
        required: true
        type: string
      head_sha:
        description: 'Commit SHA the tag points at (from the upstream CI push event)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.head_sha }}
  cancel-in-progress: false  # don't cancel an in-flight deploy

jobs:
  deploy-production:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    # Primary boundary against a malicious reusable-workflow caller:
    # refuse any invocation that did NOT come from the CI workflow's
    # tag-deploy job (which itself depends on the verify job). Without
    # this, a same-repo workflow with workflow_call permissions could
    # skip lint+test+build by calling release.yml directly. In a
    # workflow_call callee, `github.workflow` is the caller's workflow
    # name (per
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows#github-context)
    # so this rejects everyone except CI.
    if: github.workflow == 'CI'
    permissions:
      contents: read

    steps:
      - name: Checkout trusted helper from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: helper

      - name: Setup Node.js
        # Runs BEFORE the gate so the helper executes on Node 24. No
        # npm cache here (the cache-dependency-path that would speed up
        # install points at app/package-lock.json, but `app/` does not
        # exist yet; the candidate checkout is later).
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release eligibility (tag input peels to head_sha via real remote)
        id: gate
        # Event values pass via env so the shell never interpolates raw
        # workflow_call context into run:. secrets.* is allowed in env:.
        env:
          VERIFY_TAG: ${{ inputs.tag }}
          VERIFY_HEAD_SHA: ${{ inputs.head_sha }}
          VERIFY_TRUSTED_REPO: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node helper/scripts/release/verify-release.mjs

      - name: Checkout deploy candidate
        if: steps.gate.outputs.verified == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_sha }}
          persist-credentials: false
          path: app

      - name: Install Vercel CLI
        if: steps.gate.outputs.verified == 'true'
        working-directory: app
        # 62.2.0 skips linked-project owner lookup during `vercel pull`.
        run: npm install -g vercel@62.2.0

      - name: Pull Vercel project info
        if: steps.gate.outputs.verified == 'true'
        working-directory: app
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        if: steps.gate.outputs.verified == 'true'
        working-directory: app
        # The CLI reads VERCEL_TOKEN from the step environment.
        run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        if: success() && steps.gate.outputs.verified == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          TAG_KIND: ${{ steps.gate.outputs.tag_kind }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          echo "::notice::Deployed ${TAG} (${TAG_KIND}, SHA ${HEAD_SHA}) to Vercel production"
