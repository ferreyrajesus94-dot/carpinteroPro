name: Release

# Release pipeline: triggers on workflow_run from CI and proves a real Git
# tag (lightweight or annotated, peeled) points at workflow_run.head_sha.
# See docs/operations/production-readiness-audit-2026-09-13.md W4 / AC-6.
#
# Trust flow (fail closed):
#   1. Helper is checked out from default_branch BEFORE any candidate.
#      persist-credentials:false so GITHUB_TOKEN never reaches .git/config.
#   2. Setup Node runs BEFORE the gate. No npm cache here: the only
#      cache-dependency-path that would speed up install points at
#      app/package-lock.json, but `app/` does not exist yet (the candidate
#      checkout is later). Adding the cache step after the candidate
#      checkout would be a perf optimisation only; intentionally skipped.
#   3. Helper (verify-release.mjs) validates trusted repo, no fork, push
#      event (not PR), upstream CI success, all deploy secrets present,
#      and a real Git tag peels to head_sha. Helper calls
#      `git ls-remote --tags <url>` using the URL derived from the trusted
#      GITHUB_REPOSITORY context -- a PUBLIC https://github.com/<o>/<r>.git
#      call that carries no credentials. Private-repo auth is out of scope;
#      production deploys are intentionally limited to public repos.
#   4. Only after verified=true do we check out the candidate and run
#      vercel pull/deploy. The gate reduces (does not eliminate) the trust
#      boundary, and workflow_run can be manually rerun from the UI so
#      this job is NOT exactly-once delivery.
#
# head_branch is non-authoritative for tag push triggers; logged for
# diagnostics only -- a branch named v1.2.3 with no real tag MUST NOT deploy.
# `secrets.*` is not used in job-level `if:` (Actions disallows that context).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false  # don't cancel an in-flight deploy

jobs:
  deploy-production:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    # Exclude PR runs and unsuccessful CI at the job level. Detailed
    # tag/peel/secrets/foreign-repo validation lives in verify-release.mjs,
    # which runs BEFORE any candidate checkout.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout trusted helper from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: helper

      - name: Setup Node.js
        # Runs BEFORE the gate so the helper executes on Node 24. No
        # npm cache here (see header note 2).
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release eligibility (repo, fork, push, CI, tag, secrets)
        id: gate
        # Event values pass via env so the shell never interpolates raw
        # workflow_run context into run:. secrets.* is allowed in env:.
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          VERIFY_TRUSTED_REPO: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node helper/scripts/release/verify-release.mjs

      - name: Checkout deploy candidate
        if: steps.gate.outputs.verified == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_sha }}
          persist-credentials: false
          path: app

      - name: Install Vercel CLI
        if: steps.gate.outputs.verified == 'true'
        working-directory: app
        run: npm install -g vercel@latest

      - name: Pull Vercel project info
        if: steps.gate.outputs.verified == 'true'
        working-directory: app
        run: vercel pull --yes --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        if: steps.gate.outputs.verified == 'true'
        working-directory: app
        # VERCEL_TOKEN is forwarded via the env block below using safe
        # shell expansion; the value is set from secrets.* inside the
        # step env, not interpolated into run:.
        run: vercel deploy --prod --yes --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        if: success() && steps.gate.outputs.verified == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          TAG_KIND: ${{ steps.gate.outputs.tag_kind }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          echo "::notice::Deployed ${TAG} (${TAG_KIND}, SHA ${HEAD_SHA}) to Vercel production"
